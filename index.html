<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>fluspop</title>
<link rel="icon" type="image/png" href="assets/ICON.png">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root{
    --pink: #d9285e;
    --blue: #0068c0;
    --card-top: #ffffff;
    --card-bottom: #ffffff;
    --icon-bg: #fdde23;
    --btn: #ff7a1a;
    --white: #ffffff;
    --ink: #23262b;
  }

  *{ margin:0; padding:0; box-sizing:border-box; }

  body{
    font-family: 'Inter', sans-serif;
    color: var(--white);
    background: var(--blue);
    overflow-x: hidden;
  }

  h1,h2,h3{
    font-family: 'Inter', sans-serif;
  }

  a, button{ font-family: 'Inter', sans-serif; }

  /* ============ HERO ============ */
  .hero{
    position: relative;
    background: var(--pink);
    padding: 8vw;
    display: flex;
    align-items: center;
    justify-content: center;
    height: 100vh;
    height: 100svh;
  }

  .hero-inner{
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    max-width: 720px;
    margin: 0 auto;
  }

  .hero-logo{
    width: 100%;
    max-width: 340px;
    height: auto;
    display: block;
    background: transparent;
  }

  .hero-text{
    font-size: clamp(16px, 2.4vw, 22px);
    font-weight: 500;
    margin-top: 32px;
    line-height: 1.5;
    opacity: 0.95;
    color: var(--white);
    max-width: 620px;
  }

  .btn-start{
    margin-top: 32px;
    display: inline-block;
    background: var(--icon-bg);
    color: var(--blue);
    font-weight: 800;
    font-size: 16px;
    letter-spacing: 0.5px;
    padding: 12px 46px;
    border: none;
    border-radius: 999px;
    cursor: pointer;
    transition: transform 0.15s ease;
  }
  .btn-start:hover{
    transform: translateY(-2px);
  }
  .btn-start:active{
    transform: translateY(1px);
  }

  .wave{
    position: absolute;
    left: 0;
    bottom: -1px;
    width: 100%;
    line-height: 0;
  }
  .wave svg{ width: 100%; height: 80px; display:block; }

  /* ============ FUTURE SECTION ============ */
  .future-section{
    background: var(--white);
    padding: 90px 8vw 40px;
  }

  .future-row{
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 70px;
    flex-wrap: nowrap;
    max-width: 1100px;
    margin: 0 auto;
  }

  .future-left{
    flex: 0 1 460px;
    min-width: 0;
    display: flex;
    justify-content: center;
  }
  .future-left img{
    width: 100%;
    max-width: 480px;
    height: auto;
  }

  .future-right{
    flex: 1 1 auto;
    min-width: 0;
    max-width: 460px;
  }

  .future-right h2{
    font-size: clamp(26px, 4vw, 34px);
    font-weight: 800;
    line-height: 1.2;
    color: var(--blue);
  }

  .future-right p{
    margin-top: 16px;
    font-size: 15px;
    line-height: 1.7;
    color: var(--blue);
    opacity: 0.95;
    text-align: justify;
    text-align-last: left;
  }

  /* ============ HOW IT WORKS ============ */
  .how-title{
    text-align: center;
    font-size: clamp(24px, 4vw, 32px);
    font-weight: 800;
    color: var(--blue);
    margin: 80px 0 40px;
  }

  .cards-wrap{
  max-width: 1300px;
  margin: 0 auto;
  padding: 0 1vw 90px;
}

 .cards-row{
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 1px;
}

  .card{
    background: transparent;
    border-radius: 18px;
    padding: 0;
    cursor: pointer;
    border: none;
    overflow: hidden;
    transition: transform 0.15s ease;
    line-height: 0;
  }
  .card:hover{
    transform: translateY(-4px);
  }

  .card-img{
    width: 100%;
    height: auto;
    display: block;
    border-radius: 18px;
  }

  /* ============ ASK US MORE BUTTON ============ */
  .btn-ask-more{
    display: block;
    width: 100%;
    margin-top: 10px;
    background: var(--pink);
    color: var(--white);
    text-align: center;
    text-decoration: none;
    font-weight: 700;
    font-size: 14px;
    letter-spacing: 0.5px;
    padding: 15px 20px;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    transition: opacity 0.15s ease;
  }
  .btn-ask-more:hover{ opacity: 0.9; }

  /* ============ FOOTER LOGO ============ */
  .footer-logo{
    text-align: center;
    padding: 30px 8vw 70px;
  }
  .footer-logo img{
    width: 100%;
    max-width: 180px;
    height: auto;
    display: inline-block;
  }

  @media (max-width: 720px){
    .footer-logo{ padding: 20px 8vw 50px; }
    .footer-logo img{ max-width: 130px; }
  }

  /* ============ MODAL POPUP ============ */
  .modal-overlay{
    position: fixed;
    inset: 0;
    background: rgba(20, 10, 20, 0.55);
    display: none;
    align-items: center;
    justify-content: center;
    padding: 20px;
    z-index: 999;
  }
  .modal-overlay.active{
    display: flex;
  }

  .modal-box{
    background: var(--white);
    color: var(--pink);
    max-width: 480px;
    width: 100%;
    border-radius: 20px;
    border: 2px solid var(--pink);
    padding: 32px 28px 26px;
    max-height: 85vh;
    overflow-y: auto;
  }
  .modal-logo{
    display: block;
    width: 100px;
    height: auto;
    margin: 0 auto 12px;
  }

  .modal-box h3{
    font-size: 22px;
    font-weight: 800;
    margin-bottom: 14px;
    color: var(--pink);
    text-align: center;
  }

  .modal-box h4{
    font-size: 14px;
    font-weight: 700;
    margin: 16px 0 6px;
    color: var(--ink);
  }

  .modal-box ol, .modal-box ul{
    padding-left: 20px;
    font-size: 13.5px;
    line-height: 1.7;
    color: #3d3d3d;
  }

  .modal-box p{
    font-size: 13.5px;
    line-height: 1.7;
    color: #3d3d3d;
    margin-bottom: 6px;
  }

  /* Gallery mode (e.g. Caretakers: stacked photos) */
  .modal-gallery{
    display: flex;
    flex-direction: column;
    gap: 8px;
    width: 100%;
  }
  .modal-gallery img{
    width: 100%;
    height: auto;
    display: block;
    border-radius: 14px;
  }

  .btn-back{
    margin-top: 22px;
    width: 100%;
    background: var(--pink);
    color: var(--white);
    font-weight: 700;
    font-size: 14px;
    letter-spacing: 0.5px;
    padding: 13px 20px;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    transition: opacity 0.15s ease;
  }
  .btn-back:hover{ opacity: 0.9; }

  /* ============ RESPONSIVE ============ */
  @media (max-width: 720px){
    .hero{
      padding: 8vw;
    }
    .hero-logo{ max-width: 220px; }
    .hero-text{ font-size: 14px; margin-top: 20px; }
    .btn-start{ padding: 10px 34px; font-size: 13px; margin-top: 22px; }
    .future-section{ padding: 60px 6vw 20px; }
    .future-row{ gap: 18px; align-items: center; }
    .future-left{ flex-basis: 280px; }
    .future-right h2{ font-size: clamp(16px, 5vw, 20px); }
    .future-right p{ font-size: 11.5px; margin-top: 8px; line-height: 1.55; }

    .how-title{ font-size: clamp(18px, 5vw, 24px); margin: 50px 0 26px; }

    .cards-wrap{ padding: 0 2vw 90px; }
    .cards-row{
      gap: 1px;
    }
    .card{
      border-radius: 8px;
    }
    .card-img{ border-radius: 8px; }
  }

  @media (max-width: 420px){
    .hero-right{ flex-basis: 100px; }
    .future-left{ flex-basis: 220px; }
  }
</style>
</head>
<body>

  <!-- ============ HERO ============ -->
  <section class="hero">
    <div class="hero-inner">
      <img class="hero-logo" src="assets/LOGO.webp" alt="Logo">
      <p class="hero-text">Lorem ipsum dolor sit amet, consectetur adipiscing elit. Sed do eiusmod tempor incididunt ut labore</p>
      <button class="btn-start" id="startBtn">START</button>
    </div>

    <div class="wave">
      <svg viewBox="0 0 1440 80" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
        <path fill="#ffffff" d="M0,40 C40,10 80,10 120,40 C160,70 200,70 240,40 C280,10 320,10 360,40 C400,70 440,70 480,40 C520,10 560,10 600,40 C640,70 680,70 720,40 C760,10 800,10 840,40 C880,70 920,70 960,40 C1000,10 1040,10 1080,40 C1120,70 1160,70 1200,40 C1240,10 1280,10 1320,40 C1360,70 1400,70 1440,40 L1440,80 L0,80 Z"></path>
      </svg>
    </div>
  </section>

  <!-- ============ FUTURE SECTION ============ -->
  <section class="future-section" id="future">
    <div class="future-row">
      <div class="future-left">
        <img src="assets/ICON.webp" alt="Icon">
      </div>
      <div class="future-right">
        <h2>Hello, I am Popo!</h2>
        <p>Lorem ipsum dolor sit amet, consectetur adipiscing elit. Sed do eiusmod tempor incididunt ut labore et dolore magna aliqua.</p>
      </div>
    </div>

    <h2 class="how-title">Lorem Ipsum Works</h2>

    <div class="cards-wrap">
      <div class="cards-row">

        <div class="card"
          data-title="CARETAKERS"
          data-type="gallery"
          data-images='["assets/ct1.webp","assets/ct2.webp","assets/ct3.webp"]'>
          <img class="card-img" src="assets/caretakers.webp" alt="Caretakers">
        </div>

        <div class="card"
          data-title="REGULATIONS"
          data-points='[
          "One account per person.",
          "ALL STARS face claims born in 2007 or earlier are accepted. Face claims affiliated with Zionism or involved in current controversies are not permitted.",
          "Twins are not allowed unless the face claim has a real-life twin.",
          "Face claim changes are allowed once. The timing and procedure will be announced during the agency period.",
          "Minimum activity: 45 tweets on the first day and 25 tweets on following days.",
          "Posspath runs for 6 days only. If you cannot meet the tweet target, inform The Guides in advance.",
          "Unverification may occur after 24 hours of inactivity without notice or repeated failure to meet activity requirements.",
          "Joking profanities are allowed, but graphic or explicit content, including nudity or pornographic images/videos, is strictly prohibited.",
          "Interaction with outsiders is allowed as long as it does not become two-way."
          ]'
          data-closing="By joining Posspath, you agree to follow these regulations and help keep the space comfortable for everyone.">
          <img class="card-img" src="assets/regulations.webp" alt="Regulations">
        </div>

        <div class="card" data-title="How to Join?"
          data-points='[
          "Make sure your account follows only @posspath.",
          "If you&#39;re using a recycled account, kindly clear your timeline with at least 5 blank space tweets.",
          "Fill out the form that will be posted on our timeline as scheduled.",
          "Sit tight and wait for the verification announcement."]'>
          <img class="card-img" src="assets/howtojoin.webp" alt="How to Join">
        </div>

      </div>

      <a class="btn-ask-more" href="https://alterspring.org/@fluspop" target="_blank" rel="noopener">ALTERSPRING</a>
    </div>

    <div class="footer-logo">
      <img src="assets/logo-colored.webp" alt="fluspop logo">
    </div>
  </section>

  <!-- ============ MODAL POPUP ============ -->
  <div class="modal-overlay" id="modalOverlay">
      <div class="modal-box">
        <img src="assets/logo-colored.webp" alt="Logo" class="modal-logo">
        <h3 id="modalTitle">Lorem Ipsum</h3>
        <div id="modalBody"></div>
        <button class="btn-back" id="backBtn">BACK</button>
      </div>
  </div>

<script>
  // Smooth scroll START -> future section
  document.getElementById('startBtn').addEventListener('click', function(){
    document.getElementById('future').scrollIntoView({ behavior: 'smooth' });
  });

  // Modal logic
  const overlay = document.getElementById('modalOverlay');
  const modalTitle = document.getElementById('modalTitle');
  const modalBody = document.getElementById('modalBody');
  const cards = document.querySelectorAll('.card');
    const modalBox = document.querySelector('.modal-box');

  cards.forEach(card => {
    card.addEventListener('click', () => {
      const title = card.getAttribute('data-title');
      modalTitle.textContent = title;
      modalBody.innerHTML = '';

      if (card.getAttribute('data-type') === 'gallery') {
        // Gallery mode: stacked photos, flexible to modal width
        const images = JSON.parse(card.getAttribute('data-images'));
        const gallery = document.createElement('div');
        gallery.className = 'modal-gallery';
        gallery.innerHTML = images.map(src => `<img src="${src}" alt="${title}">`).join('');
        modalBody.appendChild(gallery);
      } else {
        // List mode: points + optional closing text
        const points = JSON.parse(card.getAttribute('data-points'));
        const closing = card.getAttribute('data-closing');

        const ol = document.createElement('ol');
        ol.innerHTML = points.map(p => `<li>${p}</li>`).join('');
        modalBody.appendChild(ol);

        if (closing) {
          const p = document.createElement('p');
          p.style.marginTop = '14px';
          p.textContent = closing;
          modalBody.appendChild(p);
        }
      }

            modalBox.scrollTop = 0;
      overlay.classList.add('active');
    });
  });

  document.getElementById('backBtn').addEventListener('click', () => {
    overlay.classList.remove('active');
  });

  overlay.addEventListener('click', (e) => {
    if (e.target === overlay) overlay.classList.remove('active');
  });
</script>

</body>
</html>
